# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: doon-imperial-erp
    runtime: node
    plan: free
    region: singapore       # same region as the Neon database (ap-southeast-1) for low latency
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false         # paste the Neon connection string when Render asks
      - key: CREDIT_POINTS_DATABASE_URL
        sync: false         # read-only connection string for the Credit Point Tracker's Neon database
      - key: AUTH_SECRET
        generateValue: true # Render creates a strong random secret
      - key: NEXT_PUBLIC_SHOW_DEMO_LOGINS
        value: "true"       # shows demo accounts on the login page; set to "false" for real use

  # Always-on wake-up page (free static sites never sleep). Share THIS link with the school:
  # it shows a branded loading screen while the web service above wakes up, then opens the ERP.
  # If the web service's address changes, update APP_URL in wake/index.html.
  - type: web
    name: doon-erp            # becomes https://doon-erp.onrender.com
    runtime: static
    buildCommand: echo "static wake-up page"
    staticPublishPath: ./wake
